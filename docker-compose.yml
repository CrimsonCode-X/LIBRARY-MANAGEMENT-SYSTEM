services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: libraryos
      POSTGRES_USER: libraryos
      POSTGRES_PASSWORD: libraryos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libraryos -d libraryos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
